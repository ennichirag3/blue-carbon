<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Project – Blue Carbon Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
  <div class="spatial-bg"></div>

  <div class="page-container" style="flex-direction: column; max-width: 900px; margin: 0 auto;">
    <!-- NAVBAR -->
    <nav class="app-navbar">
      <a href="dashboard.html" class="nav-brand">
        <svg class="icon-svg" style="stroke:var(--neon-lime); width:20px; height:20px;" viewBox="0 0 24 24">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        <span>Blue Carbon</span>
      </a>

      <div class="nav-links-row">
        <a href="dashboard.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="addproject.html" class="nav-tab-link active">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
          <span>Add Project</span>
        </a>
        <a href="allprojects.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          <span>All Projects</span>
        </a>
        <a href="blockchain.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
          <span>Blockchain</span>
        </a>
        <a href="overview.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>Overview</span>
        </a>
        <a href="users.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </a>
      </div>

      <a href="dashboard.html" class="btn-secondary" style="padding:8px 16px;">← Back</a>
    </nav>

    <!-- FORM CARD -->
    <div class="glass-card" id="addProjectCard">
      <div style="text-align:center; margin-bottom:28px;">
        <h1 style="font-size:28px; font-weight:800; color:#fff;">Register Blue Carbon Project</h1>
        <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">
          Add a coastal, tidal, or marine ecosystem restoration initiative for verification
        </p>
      </div>

      <form id="addProjectForm">
        <div class="form-group">
          <label for="projectName">Project Name</label>
          <input type="text" id="projectName" placeholder="e.g. Sundarbans Mangrove Tidal Restoration" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
          <div class="form-group">
            <label for="location">Location / Coordinates</label>
            <input type="text" id="location" placeholder="e.g. Bay of Bengal, India" required>
          </div>

          <div class="form-group">
            <label for="carbonSaved">Carbon Saved (kg CO₂)</label>
            <input type="number" id="carbonSaved" placeholder="48500" required>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Detailed Ecosystem Description</label>
          <textarea id="description" rows="4" placeholder="Detail the mangrove species, tidal flow, baseline satellite imagery data, and community carbon credit allocations." required></textarea>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Save & Register Project</button>
      </form>

      <div class="error-msg" id="formStatus"></div>
    </div>
  </div>

  <script src="client-api.js"></script>
  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "index.html";
    }

    const form = document.getElementById("addProjectForm");
    const status = document.getElementById("formStatus");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "";

      const name = document.getElementById("projectName").value.trim();
      const location = document.getElementById("location").value.trim();
      const carbonSaved = Number(document.getElementById("carbonSaved").value);
      const description = document.getElementById("description").value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering Project...";

      try {
        await window.clientAPI.addProject({ name, location, carbonSaved, description });

        status.style.color = "var(--neon-lime)";
        status.textContent = "✅ Project registered successfully! Redirecting...";
        setTimeout(() => {
          window.location.href = "allprojects.html";
        }, 500);
      } catch (err) {
        status.style.color = "#f87171";
        status.textContent = err.message || "Failed to save project.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Save & Register Project";
      }
    });
  </script>
</body>
</html>
