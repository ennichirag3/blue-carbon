<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Blue Carbon Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
  <div class="spatial-bg"></div>

  <div class="page-container auth-page">
    <div class="glass-card auth-wrapper" id="loginCard">
      <div class="auth-header">
        <div class="brand-leaf-icon">
          <svg class="icon-svg" style="width:28px; height:28px;" viewBox="0 0 24 24">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <h1 class="auth-title">Sign In</h1>
        <p class="auth-subtitle">Access your Blue Carbon decentralized account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="admin@cryptonest.io" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        <button type="button" class="btn-secondary" id="demoBtn" style="width:100%; margin-top:12px;">
          ⚡ Demo 1-Click Sign In (David Owner)
        </button>
      </form>

      <div class="auth-footer-link">
        Don’t have an account? <a href="register.html">Register here</a>
      </div>

      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <script src="client-api.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");
    const demoBtn = document.getElementById("demoBtn");

    async function executeLogin(email, password) {
      loginError.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying...";

      try {
        const data = await window.clientAPI.login(email, password);

        // Save session credentials
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        // Smooth 3D exit transition
        const card = document.getElementById("loginCard");
        card.style.transform = "perspective(1200px) rotateX(-6deg) translateY(-20px) scale(0.96)";
        card.style.opacity = "0";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 300);

      } catch (err) {
        loginError.textContent = err.message || "Invalid credentials.";
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      executeLogin(email, password);
    });

    demoBtn.addEventListener("click", () => {
      document.getElementById("email").value = "admin@cryptonest.io";
      document.getElementById("password").value = "Password123!";
      executeLogin("admin@cryptonest.io", "Password123!");
    });

    // 3D Tilt micro-interaction
    const card = document.getElementById("loginCard");
    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      card.style.transform = `perspective(1000px) rotateX(${-y * 0.04}deg) rotateY(${x * 0.04}deg) scale3d(1.01, 1.01, 1.01)`;
    });
    card.addEventListener("mouseleave", () => {
      card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
    });
  </script>
</body>
</html>
