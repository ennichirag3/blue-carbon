services:
  - type: web
    name: blue-carbon-spatial
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: RPC_URL
        value: http://127.0.0.1:8545
