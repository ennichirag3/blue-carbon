<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users – Blue Carbon Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
  <div class="spatial-bg"></div>

  <div class="page-container">
    <!-- NAVBAR (Identical across all pages) -->
    <nav class="app-navbar">
      <a href="dashboard.html" class="nav-brand">
        <svg class="icon-svg" style="stroke:var(--neon-lime); width:20px; height:20px;" viewBox="0 0 24 24">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        <span>Blue Carbon</span>
      </a>

      <div class="nav-links-row">
        <a href="dashboard.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="addproject.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
          <span>Add Project</span>
        </a>
        <a href="allprojects.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          <span>All Projects</span>
        </a>
        <a href="blockchain.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
          <span>Blockchain</span>
        </a>
        <a href="overview.html" class="nav-tab-link">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>Overview</span>
        </a>
        <a href="users.html" class="nav-tab-link active">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </a>
      </div>

      <div class="nav-user-group">
        <span id="userGreeting" class="user-greeting">👤 User</span>
        <button id="logoutBtn" class="btn-logout">
          <svg class="icon-svg" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          <span>Log Out</span>
        </button>
      </div>
    </nav>

    <!-- USERS CARD -->
    <div class="glass-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 style="font-size:26px; font-weight:800; color:#fff;">Registered Platform Users</h1>
          <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">Authorized network stakeholders, verifiers, and contributors</p>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span id="userCountBadge" class="badge-pill">0 Users</span>
          <a href="dashboard.html" class="btn-secondary">← Back to Dashboard</a>
        </div>
      </div>

      <div class="table-container">
        <table class="glass-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Wallet Address</th>
              <th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:30px;">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="client-api.js"></script>
  <script src="page-transitions.js"></script>
  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "index.html";
    }

    async function loadUsers() {
      try {
        const users = await window.clientAPI.getUsers();

        document.getElementById("userCountBadge").textContent = `${users.length} Users`;

        const tbody = document.getElementById("usersTableBody");
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:30px;">No registered users found.</td></tr>`;
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr>
            <td style="font-family:'JetBrains Mono'; color:var(--text-dim);">#${u.id}</td>
            <td style="font-weight:700; color:#fff;">${u.name}</td>
            <td style="color:var(--text-muted);">${u.email}</td>
            <td style="font-family:'JetBrains Mono'; font-size:12px; color:var(--neon-lime);">${u.walletAddress}</td>
            <td style="font-size:12px; color:var(--text-dim);">${u.createdAt ? u.createdAt.slice(0, 10) : '2026-04-23'}</td>
          </tr>
        `).join("");

      } catch (err) {
        console.error(err);
      }
    }

    loadUsers();
  </script>
</body>
</html>
