<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users – Blue Carbon Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
  <div class="spatial-bg"></div>

  <div class="page-container" style="flex-direction: column; max-width: 1100px; margin: 0 auto;">
    <!-- NAVBAR -->
    <nav class="app-navbar">
      <a href="dashboard.html" class="nav-brand">
        <span style="color:var(--neon-lime);">🌿</span> Blue Carbon
      </a>

      <div class="nav-links-row">
        <a href="dashboard.html" class="nav-tab-link">📊 Dashboard</a>
        <a href="addproject.html" class="nav-tab-link">➕ Add Project</a>
        <a href="allprojects.html" class="nav-tab-link">📂 All Projects</a>
        <a href="blockchain.html" class="nav-tab-link">🔗 Blockchain</a>
        <a href="overview.html" class="nav-tab-link">🌿 Overview</a>
        <a href="users.html" class="nav-tab-link active">👥 Users</a>
      </div>

      <a href="dashboard.html" class="btn-secondary" style="padding:8px 16px;">← Back</a>
    </nav>

    <!-- USERS CARD -->
    <div class="glass-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div>
          <h1 style="font-size:26px; font-weight:800; color:#fff;">👥 Registered Platform Users</h1>
          <p style="color:var(--text-muted); font-size:14px;">Authorized network stakeholders, verifiers, and contributors</p>
        </div>
        <span id="userCountBadge" class="badge-pill">0 Users</span>
      </div>

      <div class="table-container">
        <table class="glass-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Wallet Address</th>
              <th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:30px;">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "index.html";
    }

    async function loadUsers() {
      try {
        const res = await fetch("/api/users");
        const users = await res.json();

        document.getElementById("userCountBadge").textContent = `${users.length} Users`;

        const tbody = document.getElementById("usersTableBody");
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:30px;">No registered users found.</td></tr>`;
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr>
            <td style="font-family:'JetBrains Mono'; color:var(--text-dim);">#${u.id}</td>
            <td style="font-weight:700; color:#fff;">${u.name}</td>
            <td style="color:var(--text-muted);">${u.email}</td>
            <td style="font-family:'JetBrains Mono'; font-size:12px; color:var(--neon-lime);">${u.walletAddress}</td>
            <td style="font-size:12px; color:var(--text-dim);">${u.createdAt ? u.createdAt.slice(0, 10) : '2026-04-23'}</td>
          </tr>
        `).join("");

      } catch (err) {
        console.error(err);
      }
    }

    loadUsers();
  </script>
</body>
</html>
